<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VDOM Tests</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f6f8fb; --surface: #ffffff; --surface2: #f0f2fa;
      --border: #dde1ef; --accent: #5b52e8; --accent2: #00a884;
      --danger: #e03c3c; --warn: #d97706; --text: #1a1d2e; --text-muted: #6b7394;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --font-sans: 'Pretendard', system-ui, sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); padding: 24px 18px 56px; min-height: 100vh; }

    .page { max-width: 1100px; margin: 0 auto; }

    a.back { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; font-size: 13px; margin-bottom: 20px; }
    a.back:hover { text-decoration: underline; }

    .hero { background: linear-gradient(135deg, rgba(91,82,232,0.07), rgba(0,168,132,0.05)); border: 1px solid rgba(91,82,232,0.18); border-radius: 20px; padding: 24px; margin-bottom: 24px; }
    h1 { font-size: clamp(20px, 3vw, 32px); font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 6px; }
    .subtitle { color: var(--text-muted); font-size: 13px; line-height: 1.6; }

    /* ── 레이아웃 ── */
    .layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, 0.8fr); gap: 20px; align-items: start; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

    /* ── 패널 공통 ── */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; box-shadow: 0 4px 16px rgba(15,23,42,0.06); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--surface2); }
    .panel-head h2 { font-size: 15px; font-weight: 700; }
    .panel-head p { color: var(--text-muted); font-size: 12px; margin-top: 3px; }
    .run-button {
      border: none; border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff; padding: 10px 18px; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: transform 160ms, opacity 160ms;
      box-shadow: 0 6px 20px rgba(91,82,232,0.25);
      white-space: nowrap;
    }
    .run-button:hover { transform: translateY(-1px); }
    .run-button:disabled { opacity: 0.55; cursor: wait; transform: none; }

    /* ── 테스트 결과 ── */
    #test-results { padding: 16px; }
    .summary { padding: 14px 18px; border-radius: 12px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 700; }
    .all-pass { background: rgba(15,157,122,0.1); border: 1px solid rgba(15,157,122,0.25); color: var(--accent2); }
    .has-fail { background: rgba(209,67,67,0.1); border: 1px solid rgba(209,67,67,0.25); color: var(--danger); }
    .fail-count { font-size: 13px; font-weight: 400; color: var(--danger); }
    .result-list { display: flex; flex-direction: column; gap: 6px; }
    .result-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 10px; font-size: 13px; font-family: var(--font-mono); border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(15,23,42,0.04); }
    .result-item.pass { background: var(--surface); border-left: 4px solid var(--accent2); }
    .result-item.fail { background: #fff5f5; border-left: 4px solid var(--danger); }
    .result-icon { font-size: 14px; }
    .result-msg { flex: 1; }
    .result-error { color: var(--danger); font-size: 11px; }

    /* ── 미리보기 패널 ── */
    .preview { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .preview-card { border: 1px dashed rgba(91,82,232,0.25); border-radius: 12px; padding: 12px; background: rgba(91,82,232,0.02); }
    .preview-card h3 { font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--accent); }
    .preview-card p { color: var(--text-muted); font-size: 12px; line-height: 1.6; margin-bottom: 8px; }
    .fixture { min-height: 72px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); padding: 10px 12px; font-size: 13px; word-break: break-word; }
    .fixture-label { color: var(--text-muted); font-size: 12px; font-family: var(--font-mono); line-height: 1.55; }
    .module-info { color: var(--text-muted); font-size: 12px; line-height: 1.7; }
    .module-info strong { color: var(--accent); }
  </style>
</head>
<body>
<div class="page">
  <a class="back" href="../index.html">← 메인으로 돌아가기</a>

  <section class="hero">
    <h1>VDOM Tests</h1>
    <p class="subtitle">VDOM 계약을 테스트로 고정합니다.</p>
  </section>

  <section class="layout">
    <!-- 테스트 결과 패널 -->
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>테스트 결과</h2>
          <p>실행 버튼을 누르면 전체 테스트를 다시 돌립니다.</p>
        </div>
        <button id="run-tests" class="run-button" type="button">다시 실행</button>
      </div>
      <div id="test-results">테스트 실행 중...</div>
    </div>

    <!-- 미리보기 패널 -->
    <aside class="panel">
      <div class="panel-head">
        <div>
          <h2>실행 중인 테스트</h2>
          <p>마지막으로 실행된 케이스입니다.</p>
        </div>
      </div>
      <div class="preview">
        <section class="preview-card">
          <h3>테스트 케이스</h3>
          <div id="current-test" class="fixture fixture-label">대기 중...</div>
        </section>
        <section class="preview-card">
          <h3>DOM 출력 (vdomToDom 결과)</h3>
          <p>마지막으로 생성된 실제 DOM입니다.</p>
          <div id="fixture" class="fixture"></div>
        </section>
        <section class="preview-card">
          <h3>모듈 정보</h3>
          <div class="module-info">
            <strong>vdom.js</strong> — 가상 DOM 유틸리티<br><br>
            <strong>주요 API</strong><br>
            createElement · createText<br>
            vdomToDom · domToVdom · cloneVdom
          </div>
        </section>
      </div>
    </aside>
  </section>
</div>

<script type="module">
import { createElement, createText, domToVdom, vdomToDom as _vdomToDom, cloneVdom } from '../src/vdom.js';
import { init } from '../src/app.js';

let passCount = 0, failCount = 0;
const groups = [], itQueue = [];
const runButton = document.getElementById('run-tests');
let _currentGroup = null;

function describe(name, fn) {
  _currentGroup = { name, items: [] };
  groups.push(_currentGroup);
  fn();
  _currentGroup = null;
}

function it(name, fn) {
  itQueue.push({ name, fn, group: groups[groups.length - 1] });
}

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

function deepEqual(a, b) {
  if (a === b) return true;
  if (typeof a !== typeof b) return false;
  if (typeof a !== 'object' || a === null || b === null) return false;
  const keysA = Object.keys(a), keysB = Object.keys(b);
  if (keysA.length !== keysB.length) return false;
  return keysA.every(k => deepEqual(a[k], b[k]));
}

function assertEqual(actual, expected, message) {
  if (!deepEqual(actual, expected)) throw new Error(message);
}

function renderResults() {
  const container = document.getElementById('test-results');
  if (!container) return;
  const total = passCount + failCount;
  let html = '';
  html += `<div class="summary ${failCount === 0 ? 'all-pass' : 'has-fail'}">`;
  html += failCount === 0
    ? `✅ 전체 통과 — ${total}개`
    : `❌ ${failCount}개 실패 <span class="fail-count">(총 ${total}개)</span>`;
  html += '</div><div class="result-list">';
  for (const group of groups) {
    html += `<div class="group-header">${group.name}</div>`;
    for (const item of group.items) {
      html += `<div class="result-item ${item.pass ? 'pass' : 'fail'}">`;
      html += `<span class="result-icon">${item.pass ? '✔' : '✘'}</span>`;
      html += `<span class="result-msg">${item.message}</span>`;
      if (!item.pass) html += `<span class="result-error">${item.error}</span>`;
      html += '</div>';
    }
  }
  html += '</div>';
  container.innerHTML = html;
}

// vdomToDom 래핑 — 결과 DOM을 fixture에 표시
const fixture = document.getElementById('fixture');
function vdomToDom(vnode) {
  const dom = _vdomToDom(vnode);
  if (fixture && dom) {
    fixture.innerHTML = '';
    fixture.appendChild(dom.cloneNode(true));
  }
  return dom;
}

const indexHtmlText = await fetch('../index.html').then(res => res.text());
const indexDoc = new DOMParser().parseFromString(indexHtmlText, 'text/html');

function mountAppSandbox() {
  const sandbox = document.createElement('section');
  sandbox.setAttribute('data-test-sandbox', 'app');
  sandbox.innerHTML = `
    <div id="real-area"></div>
    <textarea id="test-area"></textarea>
    <button id="btn-patch"></button>
    <button id="btn-undo"></button>
    <button id="btn-redo"></button>
    <div id="diff-log"></div>
    <div id="vdom-tree"></div>
    <div id="history-info"></div>
  `;
  document.body.appendChild(sandbox);
  return sandbox;
}

function cleanupAppSandbox() {
  document.querySelector('[data-test-sandbox="app"]')?.remove();
}

// ──────────────────────────────────────────────
// 1. 현재 구현 계약 테스트
// ──────────────────────────────────────────────
describe('createText', () => {
  it('문자열을 text VNode로 만든다', () => {
    // 1. 지금 무엇을 테스트하나?
    // createText('hello')를 호출했을 때
    // 텍스트 전용 VNode가 만들어지는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 텍스트 노드는 VDOM에서 가장 기본 단위다.
    // 이 모양이 흔들리면 나중에 diff에서 텍스트 비교가 꼬일 수 있다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // createText는 어떤 값을 받아도
    // { type: 'text', value: '문자열' } 형태로 맞춰준다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 테스트 페이지 결과 목록에서
    // 이 테스트 이름이 초록색 통과로 보이는지 확인하면 된다.
    const vnode = createText('hello');

    assertEqual(
      vnode,
      { type: 'text', value: 'hello' },
      '문자열 입력은 text VNode가 된다',
      {
        input: 'hello',
        reactCompare: '실무에서는 텍스트를 별도 노드로 분리해 다루면 diff와 렌더링 분기가 단순해진다.',
      }
    );
  });

  it('숫자를 문자열로 변환해 text VNode로 만든다', () => {
    // 1. 지금 무엇을 테스트하나?
    // 숫자 123을 넣었을 때도 text VNode가 만들어지는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 사용자가 숫자를 자식으로 넣을 수도 있기 때문에
    // 값 타입이 달라도 결과 형식이 같아야 안전하다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // createText 내부에는 String(value)가 있어서
    // 숫자도 결국 '123' 같은 문자열로 바뀐다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 페이지를 새로고침하면 자동으로 다시 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 결과 목록에서 이 테스트가 통과했고,
    // value가 문자열로 처리된다고 이해하면 된다.
    const vnode = createText(123);

    assertEqual(
      vnode,
      { type: 'text', value: '123' },
      '숫자 입력은 문자열 value를 가진 text VNode가 된다',
      {
        input: 123,
        reactCompare: '실무에서는 숫자 표시값도 결국 텍스트처럼 렌더링되므로, 내부 표현을 문자열로 통일해두면 비교가 쉬워진다.',
      }
    );
  });
});

describe('createElement', () => {
  it('태그명을 소문자로 저장한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // createElement('DIV')처럼 대문자로 태그를 넣어도
    // 결과 VNode의 tag가 소문자 'div'가 되는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // HTML 태그는 대소문자를 섞어 써도 브라우저가 처리하지만
    // VDOM에서는 한 가지 규칙으로 통일해두는 편이 비교하기 쉽다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // createElement는 tag.toLowerCase()를 사용해서
    // 태그명을 항상 소문자로 바꾼 뒤 저장한다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 테스트 결과 목록에서 이 항목이 통과하면
    // 태그명 정규화 규칙이 제대로 지켜진 것이다.
    const vnode = createElement('DIV');

    assertEqual(
      vnode.tag,
      'div',
      '태그명은 항상 소문자로 저장된다',
      {
        input: 'DIV',
        reactCompare: '실무에서는 태그/노드 타입 비교 규칙이 흔들리면 diff 조건이 복잡해지므로, 내부 표현을 정규화해두는 편이 안전하다.',
      }
    );
  });

  it('data-key가 있으면 key 필드로 저장한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // createElement에 props로 data-key를 넣었을 때
    // 결과 VNode의 key 필드에 같은 값이 들어가는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 리스트를 비교할 때 key는 아주 중요하다.
    // 나중에 diff 알고리즘이 어떤 노드가 같은 노드인지 판단할 때
    // data-key를 기준으로 사용할 수 있어야 한다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // createElement는 직접 받은 key가 없으면
    // props['data-key'] 값을 읽어서 key에 저장한다.
    // 즉 data-key는 단순 속성이 아니라
    // VDOM 비교를 위한 식별자 역할도 한다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면
    // 이 테스트가 자동으로 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 테스트 결과 목록에서 이 항목이 통과하는지 보고,
    // 자세히 보기를 눌러 입력값과 실제값을 비교하면 된다.
    const vnode = createElement('li', { 'data-key': 'item-1' });

    assertEqual(
      vnode.key,
      'item-1',
      'data-key는 key 필드로 저장된다',
      {
        input: { tag: 'li', props: { 'data-key': 'item-1' } },
        reactCompare: '실무 리스트 렌더링에서는 안정적인 key가 있어야 항목 추가/삭제/재정렬 시 DOM 변경을 최소화할 수 있다.',
      }
    );
  });

  it('직접 전달한 key가 data-key보다 우선한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // createElement에 key와 data-key를 둘 다 넣었을 때
    // 직접 전달한 key가 우선되는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 현재 구현의 우선순위 규칙을 고정하지 않으면
    // 나중에 key 해석 방식이 바뀌었을 때 팀원들이 헷갈릴 수 있다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // createElement는 key ?? props['data-key'] ?? null 순서로 값을 정한다.
    // 즉 명시적 key가 있으면 data-key보다 먼저 사용한다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 자세히 보기를 눌러 입력값과 실제 key가 우선순위 규칙대로 나오는지 확인하면 된다.
    const vnode = createElement('li', { 'data-key': 'from-props' }, [], 'from-arg');

    assertEqual(
      vnode.key,
      'from-arg',
      '명시적 key는 data-key보다 우선한다',
      {
        input: { tag: 'li', props: { 'data-key': 'from-props' }, keyArg: 'from-arg' },
        reactCompare: '실무에서는 key를 어디서 읽을지 우선순위를 고정해두지 않으면 리스트 동기화 디버깅이 어려워진다.',
      }
    );
  });

  it('문자열 자식을 text VNode로 정규화한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // createElement의 children에 문자열을 넣었을 때
    // 그 문자열이 그대로 남는 게 아니라 text VNode로 바뀌는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // VDOM의 children 배열에는 형태가 제각각이면 안 된다.
    // 문자열, 숫자, 객체가 섞여 있으면 나중에 diff나 render에서 다루기 어렵다.
    // 그래서 문자열도 text VNode라는 같은 형식으로 통일해야 한다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // createElement는 내부에서 normalizeChild를 호출한다.
    // 이 함수는 문자열 자식을 만나면
    // createText('문자열')을 만들어 children 안에 넣어준다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?

    const vnode = createElement('p', {}, [undefined]);

    assertEqual(

      {
        input: { tag: 'p', props: {}, children: ['undefined (actual JS value)'] },
        reactCompare: '실무에서는 초기값 누락이나 비동기 데이터 로딩 중 undefined가 자주 생기므로, 이 입력도 안전하게 처리하는 편이 좋다.',

  it('props를 그대로 보존한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // createElement에 props를 넣었을 때
    // id, class, title 같은 속성이 VNode.props에 그대로 들어가는지 확인한다.

    // 2. 왜 이 테스트가 필요한가?

    //
    // 3. 여기서 이해해야 하는 로직은?
    // createElement는 props를 그대로 저장하지 않고

    //
    // 5. 사용자는 어디서 확인하나?

    const props = { id: 'app', class: 'card', title: 'hello' };
    const vnode = createElement('div', props);

    assertEqual(

      { id: 'app', class: 'card', title: 'hello' },

        input: { tag: 'div', props },
        reactCompare: '실무 렌더러는 props를 기반으로 실제 DOM 속성, 이벤트, 스타일을 연결하므로 이 정보가 유실되지 않는 것이 중요하다.',
      }
    );
  });
});

describe('domToVdom', () => {
  it('DOM element를 element VNode로 변환한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // 실제 DOM 엘리먼트 <div id="app"></div>를 domToVdom에 넣었을 때
    // element 타입의 VNode로 바뀌는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 이 프로젝트의 시작점은 "실제 DOM을 읽어서 VDOM으로 바꾸는 것"이다.
    // 그래서 domToVdom가 가장 기본적인 엘리먼트를
    // 올바른 VNode 형태로 바꾸는지 먼저 확인해야 한다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // domToVdom는 nodeType을 보고
    // 텍스트 노드인지, 엘리먼트 노드인지 나눈다.
    // 엘리먼트 노드라면 tagName을 소문자로 바꾸고
    // attributes를 props에 담고
    // children을 재귀적으로 다시 VNode로 변환한다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 테스트 결과 목록에서 이 항목이 통과하는지 보고,
    // 자세히 보기를 눌러 입력 DOM 설명과 실제 VNode 결과를 확인하면 된다.
    const el = document.createElement('div');
    el.setAttribute('id', 'app');

    const vnode = domToVdom(el);

    assertEqual(
      vnode,
      {
        type: 'element',
        tag: 'div',
        props: { id: 'app' },
        key: null,
        children: [],
      },
      'DOM element는 element VNode로 변환된다',
      {
        input: '<div id="app"></div>',
        reactCompare: '실무에서는 기존 DOM이나 SSR 결과를 읽어 상태 표현으로 바꾸는 작업이 필요할 수 있어, 기본 엘리먼트 변환 규칙이 중요하다.',
      }
    );
  });

  it('텍스트 자식을 text VNode로 함께 변환한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // <p>Hello</p> 같은 DOM 구조를 domToVdom에 넣었을 때
    // 부모는 element VNode, 자식 텍스트는 text VNode로 함께 변환되는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 실제 화면은 태그만 있는 게 아니라 대부분 텍스트를 포함한다.
    // 그래서 domToVdom가 자식 노드까지 재귀적으로 읽어서
    // 올바른 트리 구조를 만드는지 확인해야 한다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // domToVdom는 엘리먼트 노드를 처리할 때
    // childNodes를 하나씩 돌면서 다시 domToVdom를 호출한다.
    // 이때 텍스트 노드를 만나면 createText로 바꿔 children에 넣는다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.

    const el = document.createElement('p');
    el.textContent = 'Hello';

    const vnode = domToVdom(el);

    assertEqual(

        type: 'element',
        tag: 'p',
        props: {},

        children: [
          { type: 'text', value: 'Hello' },

      'DOM 텍스트 자식은 text VNode로 변환된다',

    //
    // 3. 여기서 이해해야 하는 로직은?
    // domToVdom는 node.nodeType이 Node.TEXT_NODE이면

    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.

  it('지원하지 않는 nodeType은 null을 반환한다', () => {

    //
    // 2. 왜 이 테스트가 필요한가?
    // 브라우저에는 comment 같은 다양한 노드 타입이 있다.

    //
    // 3. 여기서 이해해야 하는 로직은?
    // domToVdom는 TEXT_NODE, ELEMENT_NODE가 아니면

    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 테스트 결과 목록에서 이 항목이 통과하는지 보고,

    const commentNode = document.createComment('not supported');

    assertEqual(

      '지원하지 않는 nodeType은 null로 처리된다',

        input: 'Comment node: <!--not supported-->',
        reactCompare: '실무에서는 모든 DOM 노드를 다 지원하지 않을 수 있으므로, 비지원 타입의 처리 방침을 명확히 하는 것이 중요하다.',
      }

  it('중첩된 DOM 구조를 재귀적으로 VDOM 트리로 변환한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // div 안에 ul, 그 안에 li와 text가 있는 중첩 DOM 구조를

    // 그래서 단일 노드가 아니라 트리 전체가 맞게 변환되는지 봐야 한다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // domToVdom는 childNodes를 돌면서 자신을 재귀 호출하므로
    // 자식, 손자까지 내려가며 VDOM 트리를 만든다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 자세히 보기를 눌러 children 안에 ul, li, text 구조가 유지되는지 보면 된다.
    const root = document.createElement('div');
    const ul = document.createElement('ul');
    const li = document.createElement('li');
    li.textContent = 'Item';
    ul.appendChild(li);
    root.appendChild(ul);

    const vnode = domToVdom(root);

    assertEqual(
      vnode,
      {
        type: 'element',
        tag: 'div',
        props: {},
        key: null,
        children: [
          {
            type: 'element',
            tag: 'ul',
            props: {},
            key: null,
            children: [
              {
                type: 'element',
                tag: 'li',
                props: {},
                key: null,
                children: [
                  { type: 'text', value: 'Item' },
                ],
              },
            ],
          },
        ],
      },
      '중첩된 DOM 구조는 재귀적인 VDOM 트리로 변환된다',
      {
        input: '<div><ul><li>Item</li></ul></div>',
        reactCompare: [
          '실무에서는 화면이 대부분 중첩 트리 구조라서,',
          '한 레벨만 맞는 것이 아니라 트리 전체가 안정적으로 변환되어야 한다.',
        ].join('\n'),
      }
    );
  });

  it('여러 attribute를 함께 props로 보존한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // id, class, title, data-key처럼 여러 속성이 함께 있는 DOM을
    // domToVdom가 모두 props에 담는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 실제 마크업은 속성 하나만 달린 경우보다 여러 속성이 섞인 경우가 훨씬 많다.
    // 그래서 여러 attribute를 동시에 보존하는지 확인할 필요가 있다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // domToVdom는 node.attributes를 순회하면서
    // attr.name / attr.value를 props 객체에 차례로 복사한다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 자세히 보기를 눌러 입력 HTML의 여러 속성이 props에 그대로 있는지 확인하면 된다.
    const el = document.createElement('div');
    el.setAttribute('id', 'app');
    el.setAttribute('class', 'card');
    el.setAttribute('title', 'hello');
    el.setAttribute('data-key', 'item-1');

    const vnode = domToVdom(el);

    assertEqual(
      vnode.props,
      {
        id: 'app',
        class: 'card',
        title: 'hello',
        'data-key': 'item-1',
      },
      '여러 attribute는 props에 함께 보존된다',
      {
        input: '<div id="app" class="card" title="hello" data-key="item-1"></div>',
        reactCompare: '실무 마크업은 여러 속성이 섞여 있으므로, attribute 수가 늘어나도 안정적으로 맵핑되는지가 중요하다.',
      }
    );
  });

  it('빈 문자열 attribute 값도 props에 그대로 보존한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // class=""처럼 값이 빈 문자열인 속성이 있을 때
    // domToVdom가 이를 누락하지 않고 props에 보존하는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 빈 문자열은 "값이 없다"와 "속성이 없다"가 다르다.
    // 이 차이를 잃어버리면 diff에서 remove와 update를 구분하기 어려워진다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // domToVdom는 attributes를 순회하면서
    // attr.value를 그대로 props에 넣는다.
    // 따라서 빈 문자열도 ''로 저장되어야 한다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 자세히 보기를 눌러 props.class가 null이 아니라 빈 문자열인지 확인하면 된다.
    const el = document.createElement('div');
    el.setAttribute('class', '');
    el.setAttribute('id', 'empty-class');

    const vnode = domToVdom(el);

    assertEqual(
      vnode.props,
      {
        class: '',
        id: 'empty-class',
      },
      '빈 문자열 attribute 값도 props에 그대로 보존된다',
      {
        input: '<div class="" id="empty-class"></div>',
        reactCompare: '실무에서는 빈 문자열도 의도적인 상태값일 수 있어, undefined/null과 구분해서 보존하는 편이 diff 정확도에 유리하다.',
      }
    );
  });
});

describe('vdomToDom', () => {

    // { type: 'text', value: 'Hello' } 형태의 text VNode를

    //
    // 2. 왜 이 테스트가 필요한가?

    // 그중 가장 작은 단위가 텍스트 노드이므로

    //
    // 3. 여기서 이해해야 하는 로직은?
    // vdomToDom는 vnode.type이 'text'이면
    // document.createTextNode(vnode.value)를 호출한다.
    // 즉 text VNode는 실제 브라우저의 텍스트 노드로 변환된다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.

    // 자세히 보기를 눌러 입력 VNode와 실제 DOM 노드 정보가 맞는지 확인하면 된다.
    const vnode = { type: 'text', value: 'Hello' };

        nodeType: domNode.nodeType,

      }
    );

    // vdomToDom에 null을 넣었을 때

    // vdomToDom는 맨 앞에서 if (!vnode) return document.createTextNode('');
    // 를 사용한다.
    // 즉 입력이 없으면 빈 문자열을 가진 텍스트 노드를 만든다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 테스트 결과 목록에서 이 항목이 통과하는지 보고,

    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 자세히 보기를 눌러 style attribute와 실제 style 값이 함께 반영되는지 확인하면 된다.
    const vnode = {
      type: 'element',
      tag: 'div',
      props: { style: 'color: purple; background-color: pink;' },
      key: null,
      children: [],
    };

    const domNode = vdomToDom(vnode);

    assertEqual(
      {
        styleAttr: domNode.getAttribute('style'),
        color: domNode.style.color,
        backgroundColor: domNode.style.backgroundColor,
      },
      {
        styleAttr: 'color: purple; background-color: pink;',
        color: 'purple',
        backgroundColor: 'pink',
      },
      'style 문자열은 일반 attribute 규칙으로 실제 DOM에 반영된다',
      {
        input: vnode,
        reactCompare: '실무에서는 style 표현이 객체 기반인지 문자열 기반인지 팀 계약에 따라 달라질 수 있어, 현재 구현의 분기 규칙을 테스트로 고정해두는 것이 중요하다.',
      }
    );
  });

  it('checked 불리언 props도 실제 DOM 속성으로 반영한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // checked 같은 다른 boolean 속성도
    // disabled와 같은 규칙으로 DOM에 반영되는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // boolean 속성 처리가 disabled 하나만 맞고 나머지가 틀리면
    // 실제 폼 UI에서 버그가 날 수 있다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // setDomProp의 booleanAttrs 목록에는 checked도 포함되어 있다.
    // 따라서 true면 빈 문자열 속성으로 붙어야 한다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 자세히 보기를 눌러 checked 속성이 실제 DOM에 존재하는지 확인하면 된다.
    const vnode = {
      type: 'element',
      tag: 'input',
      props: { checked: true },
      key: null,
      children: [],
    };

    const domNode = vdomToDom(vnode);

    assertEqual(
      { checkedAttr: domNode.getAttribute('checked') },
      { checkedAttr: '' },
      'checked 불리언 props는 빈 문자열 속성으로 반영된다',
      {
        input: vnode,
        reactCompare: '실무 폼 UI에서는 checked, selected, disabled 같은 boolean 속성이 일관되게 처리되어야 상태 버그를 줄일 수 있다.',
      }
    );
  });

  it('style과 children이 함께 있어도 둘 다 반영한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // style props와 text children이 함께 있는 VNode를
    // vdomToDom가 동시에 처리하는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 실제 컴포넌트는 속성만 있거나 자식만 있는 경우보다
    // 여러 요소가 함께 있는 경우가 많다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // vdomToDom는 먼저 props를 적용하고
    // 그 다음 children을 순회하며 append 한다.
    // 즉 style과 children은 서로 배타적이지 않고 함께 처리된다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 자세히 보기를 눌러 style 값과 자식 텍스트가 함께 살아 있는지 보면 된다.
    const vnode = {
      type: 'element',
      tag: 'p',
      props: { style: { color: 'green' } },
      key: null,
      children: [
        { type: 'text', value: 'Styled text' },
      ],
    };

    const domNode = vdomToDom(vnode);

    assertEqual(
      {
        color: domNode.style.color,
        text: domNode.textContent,
      },
      {
        color: 'green',
        text: 'Styled text',
      },
      'style과 children은 함께 실제 DOM에 반영된다',
      {
        input: vnode,
        reactCompare: '실무에서는 속성 적용과 자식 렌더링이 함께 일어나므로, 한쪽만 맞는 테스트보다 조합 케이스가 더 유의미하다.',
      }
    );
  });
});

describe('cloneVdom', () => {
  it('복사본을 수정해도 원본 VDOM은 변하지 않는다', () => {
    // 1. 지금 무엇을 테스트하나?
    // cloneVdom으로 복사한 뒤 복사본의 props와 children을 바꿨을 때
    // 원본 VDOM 데이터가 그대로 유지되는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // history, undo/redo 같은 기능은
    // 예전 상태를 안전하게 저장해두는 것이 핵심이다.
    // 얕은 복사면 새 상태를 바꿀 때 옛 상태까지 같이 바뀌어서
    // 히스토리 기능이 망가질 수 있다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // cloneVdom는 element면 props를 새 객체로 복사하고,
    // children도 재귀적으로 다시 cloneVdom를 호출한다.
    // 그래서 중첩된 자식까지 독립된 새 객체가 된다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 테스트 결과 목록에서 이 항목이 통과하는지 보고,
    // 자세히 보기를 눌러 원본 구조가 수정 전 그대로 남아 있는지 확인하면 된다.
    const original = {
      type: 'element',
      tag: 'div',
      props: { id: 'app' },
      key: null,
      children: [
        { type: 'text', value: 'Hello' },
        {
          type: 'element',
          tag: 'span',
          props: { class: 'label' },
          key: null,
          children: [],
        },
      ],
    };

    const cloned = cloneVdom(original);
    cloned.props.id = 'changed';
    cloned.children[0].value = 'Changed';
    cloned.children[1].props.class = 'updated';

    assertEqual(
      original,
      {
        type: 'element',
        tag: 'div',
        props: { id: 'app' },
        key: null,
        children: [
          { type: 'text', value: 'Hello' },
          {
            type: 'element',
            tag: 'span',
            props: { class: 'label' },
            key: null,
            children: [],
          },
        ],
      },
      'cloneVdom은 원본과 분리된 깊은 복사본을 만든다',
      {
        input: original,
        reactCompare: '실무의 undo/redo, 낙관적 업데이트, 이전 상태 비교는 원본 스냅샷 보존이 핵심이라 깊은 복사 계약이 중요하다.',
      }
    );
  });

  it('text VNode도 새 객체로 복사한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // text VNode를 cloneVdom으로 복사한 뒤
    // 복사본의 value를 바꿔도 원본이 유지되는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // element만 깊은 복사되고 text는 같은 객체를 공유하면
    // 히스토리나 diff에서 텍스트가 의도치 않게 같이 바뀔 수 있다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // cloneVdom는 text 타입이면 바로 새 객체
    // { type: 'text', value: vnode.value } 를 만들어 반환한다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 테스트 결과 목록에서 이 항목이 통과하는지 보고,
    // 자세히 보기를 눌러 원본 text VNode가 그대로인지 확인하면 된다.
    const original = { type: 'text', value: 'Hello' };
    const cloned = cloneVdom(original);
    cloned.value = 'Changed';

    assertEqual(
      original,
      { type: 'text', value: 'Hello' },
      'text VNode도 원본과 분리된 새 객체로 복사된다',
      {
        input: { type: 'text', value: 'Hello' },
        reactCompare: '실무에서는 텍스트만 바뀌는 케이스도 많아, text 노드도 독립 스냅샷이어야 상태 추적이 안전하다.',
      }
    );
  });

  it('style 객체를 가진 props도 복사본 수정 시 원본이 변하지 않아야 한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // props.style처럼 중첩 객체가 있을 때도
    // cloneVdom 결과를 수정하면 원본 style 객체는 그대로 유지되는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // history 스냅샷은 깊은 복사여야 한다는 계약이 있다.
    // style 같은 중첩 객체가 공유되면
    // undo/redo용 과거 상태가 나중 수정에 오염될 수 있다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // 깊은 복사 계약이라면
    // props 안의 중첩 객체도 새 참조로 분리되어야 한다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 자세히 보기를 눌러 style 참조가 분리됐는지,
    // 그리고 복사본 수정 후 원본 style 값이 유지되는지를 보면 된다.
    const original = {
      type: 'element',
      tag: 'div',
      props: { style: { color: 'red', backgroundColor: 'blue' } },
      key: null,
      children: [],
    };

    const cloned = cloneVdom(original);
    const sameStyleRef = cloned.props.style === original.props.style;
    cloned.props.style.color = 'green';

    assertEqual(
      {
        sameStyleRef,
        originalStyle: original.props.style,
        clonedStyle: cloned.props.style,
      },
      {
        sameStyleRef: false,
        originalStyle: { color: 'red', backgroundColor: 'blue' },
        clonedStyle: { color: 'green', backgroundColor: 'blue' },
      },
      '중첩 style 객체도 원본과 분리된 깊은 복사여야 한다',
      {
        input: original,
        reactCompare: '실무의 state history는 중첩 props까지 독립적이어야 안전하므로, style 같은 객체도 원본과 참조를 공유하지 않아야 한다.',
      }
    );
  });

  it('입력이 null이면 null을 반환한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // cloneVdom에 null을 넣었을 때
    // 안전하게 null을 그대로 반환하는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 히스토리나 방어 로직에서 값이 없을 수도 있으므로
    // clone 단계도 null 입력을 안전하게 처리해야 한다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // cloneVdom는 맨 앞에서 if (!vnode) return null; 로 처리한다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 자세히 보기를 눌러 입력값 null과 반환값 null을 확인하면 된다.
    const cloned = cloneVdom(null);

    assertEqual(
      cloned,
      null,
      'cloneVdom은 null 입력을 null로 반환한다',
      {
        input: null,
        reactCompare: '실무 상태 파이프라인에서는 빈 입력이 섞여 들어올 수 있으므로 clone 함수도 null-safe한 편이 다루기 쉽다.',
      }
    );
  });
});

describe('DOM ↔ VDOM 왕복', () => {
  it('DOM을 VDOM으로 바꾼 뒤 다시 DOM으로 만들면 기본 구조가 유지된다', () => {
    // 1. 지금 무엇을 테스트하나?
    // 실제 DOM을 domToVdom로 바꾸고,
    // 그 결과를 다시 vdomToDom로 만들었을 때
    // 기본 태그/속성/텍스트 구조가 유지되는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 이 프로젝트는 처음에 실제 DOM을 읽어서 VDOM을 만들고,
    // 나중에 그 VDOM으로 테스트 영역이나 실제 영역을 다시 렌더링한다.
    // 즉 양방향 변환이 모두 어느 정도 일관돼야 요구사항을 만족할 수 있다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // domToVdom는 DOM을 JS 객체 트리로 바꾸고,
    // vdomToDom는 그 JS 객체 트리를 다시 실제 DOM으로 만든다.
    // 이 테스트는 두 함수가 함께 작동했을 때
    // 핵심 구조가 보존되는지를 보는 통합 성격의 테스트다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 테스트 결과 목록에서 이 항목이 통과하는지 보고,
    // 자세히 보기를 눌러 입력 HTML과 실제 결과 구조를 비교하면 된다.
    const originalDom = document.createElement('div');
    originalDom.setAttribute('id', 'app');

    const child = document.createElement('p');
    child.textContent = 'Hello';
    originalDom.appendChild(child);

    const vnode = domToVdom(originalDom);
    const recreatedDom = vdomToDom(vnode);

    assertEqual(
      {
        tagName: recreatedDom.tagName.toLowerCase(),
        id: recreatedDom.getAttribute('id'),
        childTag: recreatedDom.childNodes[0]?.tagName?.toLowerCase(),
        childText: recreatedDom.childNodes[0]?.textContent,
      },
      {
        tagName: 'div',
        id: 'app',
        childTag: 'p',
        childText: 'Hello',
      },
      'DOM -> VDOM -> DOM 왕복 후에도 기본 구조가 유지된다',
      {
        input: '<div id="app"><p>Hello</p></div>',
        reactCompare: '실무에서는 파싱과 렌더링 사이를 왕복할 때 핵심 구조가 유지되는지가 중요하며, 100% 동일성보다 의미 보존이 더 중요할 때가 많다.',
      }
    );
  });

  it('data-key가 있는 DOM도 왕복 후 key 관련 구조를 유지한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // data-key가 있는 DOM을 VDOM으로 바꾼 뒤 다시 DOM으로 만들었을 때
    // data-key 속성이 유지되는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 리스트 diff에서 중요한 key 정보는
    // DOM -> VDOM -> DOM 흐름에서도 잃어버리면 안 된다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // domToVdom는 data-key를 props와 key로 저장하고,
    // vdomToDom는 props를 다시 DOM attribute로 반영한다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 자세히 보기를 눌러 data-key가 최종 DOM에도 남아 있는지 보면 된다.
    const originalDom = document.createElement('li');
    originalDom.setAttribute('data-key', 'item-1');
    originalDom.textContent = 'Milk';

    const vnode = domToVdom(originalDom);
    const recreatedDom = vdomToDom(vnode);

    assertEqual(
      {
        tagName: recreatedDom.tagName.toLowerCase(),
        dataKey: recreatedDom.getAttribute('data-key'),
        text: recreatedDom.textContent,
      },
      {
        tagName: 'li',
        dataKey: 'item-1',
        text: 'Milk',
      },
      'data-key가 있는 DOM도 왕복 후 핵심 구조를 유지한다',
      {
        input: '<li data-key="item-1">Milk</li>',
        reactCompare: [
          '실무에서는 key 정보가 화면에 직접 보이지 않더라도 리스트 식별에 중요하다.',
          '현재 구현은 data-key attribute를 통해 이 식별 정보를 왕복 보존한다.',
        ].join('\n'),
      }
    );
  });

  it('children이 없는 단순 DOM도 왕복 후 빈 children 구조를 유지한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // 자식이 없는 단순 DOM을 왕복했을 때
    // 불필요한 자식이 생기지 않고 빈 구조가 유지되는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 단순 노드도 복잡한 노드만큼 자주 쓰이며,
    // 빈 children 처리 규칙이 흔들리면 patch 경로도 헷갈릴 수 있다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // domToVdom는 childNodes가 없으면 children: []를 만들고,
    // vdomToDom도 children이 없으면 추가 append 없이 element만 생성한다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 자세히 보기를 눌러 왕복 후 childNodes 개수가 0인지 보면 된다.
    const originalDom = document.createElement('section');
    originalDom.setAttribute('id', 'empty');

    const recreatedDom = vdomToDom(domToVdom(originalDom));

    assertEqual(
      {
        tagName: recreatedDom.tagName.toLowerCase(),
        id: recreatedDom.getAttribute('id'),
        childCount: recreatedDom.childNodes.length,
      },
      {
        tagName: 'section',
        id: 'empty',
        childCount: 0,
      },
      '자식 없는 DOM도 왕복 후 빈 구조를 유지한다',
      {
        input: '<section id="empty"></section>',
        reactCompare: '실무에서는 빈 컨테이너 상태도 많기 때문에, 비어 있는 children 처리 규칙이 안정적이어야 후속 업데이트가 단순해진다.',
      }
    );
  });

  it('null 자식으로 만든 빈 텍스트 노드도 왕복 후 소실되지 않아야 한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // null 자식을 createElement로 빈 text VNode로 만든 뒤
    // DOM으로 렌더링하고 다시 VDOM으로 읽어와도 그 placeholder가 유지되는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // null 자식을 빈 text VNode로 정규화하는 계약이 있다면
    // 왕복 과정에서도 그 위치 정보가 사라지지 않아야 일관성이 있다.
    // 중간에 소실되면 children 개수와 path 기준이 달라질 수 있다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // createElement는 null을 빈 text VNode로 바꾸지만,
    // domToVdom는 빈 문자열 텍스트를 공백 노드처럼 제거할 수 있다.
    // 이 테스트는 그 계약 충돌을 드러낸다.
    //
    // 4. 어떻게 실행하나?
    // tests/vdom.test.html 파일을 브라우저에서 열거나 새로고침하면 자동 실행된다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 자세히 보기를 눌러 왕복 전후 children 구조를 비교하면 된다.
    const originalVnode = createElement('div', {}, [null, 'tail']);
    const recreatedVnode = domToVdom(vdomToDom(originalVnode));

    assertEqual(
      recreatedVnode.children,
      [
        { type: 'text', value: '' },
        { type: 'text', value: 'tail' },
      ],
      'null 자식 placeholder도 왕복 후 유지되어야 한다',
      {
        input: originalVnode,
        reactCompare: '실무에서는 children 위치 보존 규칙이 흔들리면 diff path와 history 비교가 어긋날 수 있어, 빈 placeholder 처리도 일관돼야 한다.',
      }
    );
  });
});

// ──────────────────────────────────────────────
// 2. 과제 요구사항 기준 테스트
// ──────────────────────────────────────────────
describe('과제 요구사항 기준 테스트', () => {
  it('메인 페이지에 실제 영역, 테스트 영역, Patch/뒤로가기/앞으로가기 버튼이 있다', () => {
    // 1. 지금 무엇을 테스트하나?
    // index.html에 과제에서 요구한 핵심 UI 요소들이 실제로 있는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 기능이 아무리 좋아도 요구한 화면 구조가 빠져 있으면 과제 요구사항을 만족했다고 보기 어렵다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // 이 테스트는 구현 로직이 아니라 페이지 골격 자체를 검증한다.
    // 즉 요구사항의 "UI 계약"을 확인하는 테스트다.
    //
    // 4. 어떻게 실행하나?
    // 서버가 켜진 상태에서 tests/vdom.test.html을 열면
    // index.html을 fetch해서 자동 검사한다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 자세히 보기를 눌러 필수 요소들의 존재 여부를 바로 비교하면 된다.
    assertEqual(
      {
        realArea: !!indexDoc.getElementById('real-area'),
        testArea: !!indexDoc.getElementById('test-area'),
        patchButton: !!indexDoc.getElementById('btn-patch'),
        undoButton: !!indexDoc.getElementById('btn-undo'),
        redoButton: !!indexDoc.getElementById('btn-redo'),
      },
      {
        realArea: true,
        testArea: true,
        patchButton: true,
        undoButton: true,
        redoButton: true,
      },
      '요구된 핵심 UI 요소가 메인 페이지에 존재한다',
      {
        input: 'index.html',
        reactCompare: '실무에서도 기능 테스트 이전에 화면 골격과 필수 인터랙션 포인트가 존재하는지 확인하는 smoke test가 중요하다.',
      }
    );
  });

  it('초기화부터 Patch, Undo, Redo까지 요구사항의 핵심 흐름이 동작한다', () => {
    // 1. 지금 무엇을 테스트하나?
    // app.init() 이후
    // 초기 렌더 -> 테스트 영역 수정 -> Patch -> Undo -> Redo 흐름이
    // 실제 영역, 테스트 영역, 히스토리에 맞게 반영되는지 확인한다.
    //
    // 2. 왜 이 테스트가 필요한가?
    // 이 테스트 하나가 과제 요구사항의 핵심 흐름 대부분을 덮는다.
    // 즉 "로드", "Patch 적용", "히스토리 저장", "Undo/Redo 동기화"를 한 번에 보는 통합 테스트다.
    //
    // 3. 여기서 이해해야 하는 로직은?
    // init은 초기 상태 세팅,
    // Patch는 domToVdom -> diff -> applyPatches -> history.push,
    // Undo/Redo는 History에서 상태를 꺼내 실제 영역과 테스트 영역을 함께 되돌린다.
    //
    // 4. 어떻게 실행하나?
    // 테스트용 샌드박스 DOM을 만든 뒤 init을 호출하고,
    // 버튼 click을 직접 발생시켜 흐름을 검증한다.
    //
    // 5. 사용자는 어디서 확인하나?
    // 자세히 보기를 눌러 초기화, Patch 후 상태, Undo 후 상태, Redo 후 상태가 모두 기대와 맞는지 한눈에 볼 수 있다.
    cleanupAppSandbox();
    const sandbox = mountAppSandbox();

    try {
      init();

      const realArea = sandbox.querySelector('#real-area');
      const testArea = sandbox.querySelector('#test-area');
      const patchButton = sandbox.querySelector('#btn-patch');
      const undoButton = sandbox.querySelector('#btn-undo');
      const redoButton = sandbox.querySelector('#btn-redo');
      const historyInfo = sandbox.querySelector('#history-info');

      const initState = {
        initRealAreaHasOriginalText: realArea.textContent.includes('Shopping List'),
        initTestAreaHasOriginalText: testArea.value.includes('Shopping List'),
        historyAfterInit: historyInfo.textContent,
      };

      testArea.value = `<div id="app">
  <h1>Updated List</h1>
  <ul>
    <li class="done" data-key="item-1">Milk</li>
    <li data-key="item-2">Eggs</li>
    <li data-key="item-3">Bread</li>
  </ul>
  <p class="count">Still 3 items</p>
</div>`;
      patchButton.click();

      const patchState = {
        realAreaHasPatchedText: realArea.textContent.includes('Updated List'),
        testAreaKeepsPatchedText: testArea.value.includes('Updated List'),
        realAreaHasPatchedCount: realArea.textContent.includes('Still 3 items'),
        historyAfterPatch: historyInfo.textContent,
      };

      undoButton.click();
      const undoState = {
        undoRealAreaHasOriginalText: realArea.textContent.includes('Shopping List'),
        undoTestAreaHasOriginalText: testArea.value.includes('Shopping List'),
        historyAfterUndo: historyInfo.textContent,
      };

      redoButton.click();
      const redoState = {
        realAreaHasUpdatedText: realArea.textContent.includes('Updated List'),
        testAreaHasUpdatedText: testArea.value.includes('Updated List'),
        historyAfterRedo: historyInfo.textContent,
      };

      assertEqual(
        {
          ...initState,
          ...patchState,
          ...undoState,
          ...redoState,
        },
        {
          initRealAreaHasOriginalText: true,
          initTestAreaHasOriginalText: true,
          historyAfterInit: '히스토리: 1 / 1',
          realAreaHasPatchedText: true,
          testAreaKeepsPatchedText: true,
          realAreaHasPatchedCount: true,
          historyAfterPatch: '히스토리: 2 / 2',
          undoRealAreaHasOriginalText: true,
          undoTestAreaHasOriginalText: true,
          historyAfterUndo: '히스토리: 1 / 2',
          realAreaHasUpdatedText: true,
          testAreaHasUpdatedText: true,
          historyAfterRedo: '히스토리: 2 / 2',
        },
        '초기화부터 Patch, Undo, Redo까지 요구사항의 핵심 흐름이 동작한다',
        {
          input: 'Init -> Patch -> Undo -> Redo flow',
          reactCompare: '실무에서는 이력 이동 시 화면 일부만 바뀌는 반쪽짜리 상태 불일치가 자주 버그가 되므로, 여러 표시 영역의 동기화 검증이 중요하다.',
        }
      );
    } finally {
      cleanupAppSandbox();
    }
  });
});

async function runTests() {
  passCount = 0;
  failCount = 0;
  for (const group of groups) group.items = [];
  const currentTestEl = document.getElementById('current-test');
  cleanupAppSandbox();
  if (fixture) fixture.innerHTML = '';
  if (currentTestEl) currentTestEl.textContent = '테스트 실행 중...';
  if (runButton) runButton.disabled = true;

  try {
    for (const item of itQueue) {
      if (currentTestEl) currentTestEl.textContent = item.name;
      await new Promise(r => setTimeout(r, 0));
      try {
        await item.fn();
        item.group.items.push({ pass: true, message: item.name });
        passCount++;
      } catch(e) {
        item.group.items.push({ pass: false, message: item.name, error: e.message });
        failCount++;
      }
      await new Promise(r => setTimeout(r, 80));
    }
  } finally {
    if (currentTestEl) currentTestEl.textContent = `✅ 완료 (${passCount}/${passCount + failCount})`;
    renderResults();
    if (runButton) runButton.disabled = false;
  }
}

runButton?.addEventListener('click', () => {
  runTests();
});

runTests();
</script>
