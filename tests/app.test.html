<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Module Tests</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f6f8fb; --surface: #ffffff; --surface2: #f0f2fa;
      --border: #dde1ef; --accent: #5b52e8; --accent2: #00a884;
      --danger: #e03c3c; --warn: #d97706; --text: #1a1d2e; --text-muted: #6b7394;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --font-sans: 'Pretendard', system-ui, sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); padding: 24px 18px 56px; min-height: 100vh; }

    .page { max-width: 1200px; margin: 0 auto; }

    a.back { display: inline-flex; align-items: center; gap: 6px; color: var(--accent2); text-decoration: none; font-size: 13px; margin-bottom: 20px; }
    a.back:hover { text-decoration: underline; }

    .hero { background: linear-gradient(135deg, rgba(91,82,232,0.07), rgba(0,168,132,0.05)); border: 1px solid rgba(91,82,232,0.18); border-radius: 20px; padding: 24px; margin-bottom: 24px; }
    h1 { font-size: clamp(20px, 3vw, 32px); font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 6px; }
    .subtitle { color: var(--text-muted); font-size: 13px; line-height: 1.6; }
    .note { margin-bottom: 0; padding: 10px 14px; border-radius: 10px; background: rgba(217,119,6,0.07); border: 1px solid rgba(217,119,6,0.2); color: #92400e; font-size: 12px; line-height: 1.5; margin-top: 10px; }

    /* ── 레이아웃 ── */
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 0.9fr); gap: 20px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

    /* ── 패널 공통 ── */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--surface2); }
    .panel-head h2 { font-size: 15px; font-weight: 700; }
    .panel-head p { color: var(--text-muted); font-size: 12px; margin-top: 3px; }

    /* ── 테스트 결과 ── */
    #test-results { padding: 16px; }
    .summary { padding: 14px 18px; border-radius: 12px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 700; }
    .all-pass { background: rgba(15,157,122,0.1); border: 1px solid rgba(15,157,122,0.25); color: var(--accent2); }
    .has-fail { background: rgba(209,67,67,0.1); border: 1px solid rgba(209,67,67,0.25); color: var(--danger); }
    .fail-count { font-size: 13px; font-weight: 400; color: var(--danger); }
    .result-list { display: flex; flex-direction: column; gap: 6px; }
    .result-item { display: flex; align-items: baseline; gap: 10px; padding: 9px 14px; border-radius: 7px; font-size: 13px; font-family: var(--font-mono); border: 1px solid var(--border); }
    .result-item.pass { background: var(--surface); border-left: 3px solid var(--accent2); }
    .result-item.fail { background: #fff5f5; border-left: 3px solid var(--danger); }
    .result-icon { font-size: 14px; }
    .result-msg { flex: 1; }
    .result-error { color: var(--danger); font-size: 11px; }

    /* ── 미리보기 패널 ── */
    .preview { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .preview-card { border: 1px dashed rgba(91,82,232,0.25); border-radius: 12px; padding: 12px; background: rgba(91,82,232,0.02); }
    .preview-card h3 { font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--accent); }
    .preview-card p { color: var(--text-muted); font-size: 12px; line-height: 1.6; margin-bottom: 8px; }
    .fixture-label { min-height: 56px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); padding: 10px 12px; font-size: 12px; font-family: var(--font-mono); color: var(--text-muted); word-break: break-word; line-height: 1.55; }

    /* ── 샌드박스 (앱 미리보기) ── */
    #sandbox {
      border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text);
      padding: 10px; font-size: 12px;
      max-height: 200px; overflow: auto;
    }
    #sandbox .toolbar { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    #sandbox button { padding: 3px 8px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface2); font-size: 11px; cursor: pointer; color: var(--text); }
    #sandbox button:disabled { opacity: 0.45; cursor: not-allowed; }
    #sandbox #history-info { font-size: 10px; color: var(--text-muted); align-self: center; }
    #sandbox #app-alert { padding: 4px 8px; border-radius: 5px; background: rgba(224,60,60,0.07); border: 1px solid rgba(224,60,60,0.2); color: var(--danger); font-size: 11px; margin-bottom: 6px; }
    #sandbox #app-alert[hidden] { display: none; }
    #sandbox #real-area { border: 1px dashed var(--border); border-radius: 5px; padding: 6px; min-height: 32px; margin-bottom: 6px; font-size: 11px; overflow: hidden; }
    #sandbox #real-area h1, #sandbox #real-area h2, #sandbox #real-area h3 { font-size: 13px; font-weight: 700; margin: 0 0 3px; }
    #sandbox #real-area ul, #sandbox #real-area ol { margin: 0; padding-left: 14px; }
    #sandbox #real-area li { margin: 0; font-size: 11px; line-height: 1.5; }
    #sandbox #real-area p { margin: 2px 0; font-size: 11px; }
    #sandbox textarea { width: 100%; border: 1px solid var(--border); border-radius: 5px; padding: 4px 6px; font-size: 10px; font-family: var(--font-mono); resize: none; height: 36px; box-sizing: border-box; background: var(--surface2); color: var(--text); }
    #sandbox #diff-log, #sandbox #vdom-tree { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 3px; white-space: pre-wrap; max-height: 32px; overflow: hidden; }
  </style>
</head>
<body>
<div class="page">
  <a class="back" href="../index.html">← 메인으로 돌아가기</a>

  <section class="hero">
    <h1>App 모듈 테스트</h1>
    <p class="subtitle">초기 렌더링, patch, undo/redo, 예외 입력 처리 흐름을 검증합니다.</p>
    <div class="note">`app.js`는 모듈 내부 상태를 가지므로, 각 테스트마다 쿼리스트링을 다르게 붙여 새 모듈 인스턴스로 import 합니다.</div>
  </section>

  <section class="layout">
    <!-- 테스트 결과 패널 -->
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>테스트 결과</h2>
          <p>페이지 로드 시 자동으로 실행됩니다.</p>
        </div>
      </div>
      <div id="test-results">테스트 실행 중...</div>
    </div>

    <!-- 미리보기 패널 -->
    <aside class="panel">
      <div class="panel-head">
        <div>
          <h2>실행 중인 테스트</h2>
          <p>현재 실행 중인 케이스와 앱 상태입니다.</p>
        </div>
      </div>
      <div class="preview">
        <section class="preview-card">
          <h3>테스트 케이스</h3>
          <div id="current-test" class="fixture-label">대기 중...</div>
        </section>
        <section class="preview-card">
          <h3>실행 픽스처 (앱 샌드박스)</h3>
          <p>테스트가 실제로 마운트하는 앱 DOM입니다.</p>
          <div id="sandbox"></div>
        </section>
      </div>
    </aside>
  </section>
</div>

  <script type="module">
    let passCount = 0, failCount = 0;
    const results = [];

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    function renderResults() {
      const container = document.getElementById('test-results');
      if (!container) return;
      const total = passCount + failCount;
      let html = `<div class="summary ${failCount === 0 ? 'all-pass' : 'has-fail'}">`;
      html += failCount === 0
        ? `✅ 전체 통과 — ${total}개`
        : `❌ ${failCount}개 실패 <span class="fail-count">(총 ${total}개)</span>`;
      html += '</div><div class="result-list">';
      for (const r of results) {
        html += `<div class="result-item ${r.pass ? 'pass' : 'fail'}">`;
        html += `<span class="result-icon">${r.pass ? '✔' : '✘'}</span>`;
        html += `<span class="result-msg">${r.message}</span>`;
        if (!r.pass) html += `<span class="result-error">${r.error}</span>`;
        html += '</div>';
      }
      html += '</div>';
      container.innerHTML = html;
    }

    const sandbox = document.getElementById('sandbox');
    const currentTestEl = document.getElementById('current-test');

    function buildFixture() {
      sandbox.innerHTML = `
        <div class="toolbar">
          <button id="btn-patch">Patch</button>
          <button id="btn-undo">Undo</button>
          <button id="btn-redo">Redo</button>
          <span id="history-info"></span>
        </div>
        <div id="app-alert" hidden></div>
        <div id="real-area"></div>
        <textarea id="test-area"></textarea>
        <div id="diff-log"></div>
        <div id="vdom-tree"></div>
      `;
    }

    async function bootApp(label) {
      buildFixture();
      const mod = await import(`../src/app.js?case=${encodeURIComponent(label)}-${Date.now()}-${Math.random()}`);
      mod.init();
      return {
        realArea: document.getElementById('real-area'),
        testArea: document.getElementById('test-area'),
        patchBtn: document.getElementById('btn-patch'),
        undoBtn: document.getElementById('btn-undo'),
        redoBtn: document.getElementById('btn-redo'),
        diffLog: document.getElementById('diff-log'),
        vdomTree: document.getElementById('vdom-tree'),
        historyInfo: document.getElementById('history-info'),
        appAlert: document.getElementById('app-alert'),
      };
    }

    async function runCase(name, fn) {
      if (currentTestEl) currentTestEl.textContent = name;
      await new Promise(r => setTimeout(r, 0));   // repaint으로 테스트명 표시
      try {
        await fn();
        results.push({ pass: true, message: name });
        passCount++;
        console.log(`PASS: ${name}`);
      } catch (error) {
        results.push({ pass: false, message: name, error: error.message });
        failCount++;
        console.error(`FAIL: ${name}`, error);
      }
      await new Promise(r => setTimeout(r, 150)); // 다음 테스트 전 시각적 여백
    }

    function click(el) {
      el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    }

    function normalize(html) {
      return html.replace(/\s+/g, ' ').trim();
    }

    await runCase('init: 초기 DOM과 버튼 상태를 세팅한다', async () => {
      const app = await bootApp('init');

      assert(app.realArea.querySelector('#app') !== null, '초기 루트가 렌더링된다');
      assert(app.testArea.value.trim().length > 0, '초기 HTML이 textarea에 채워진다');
      assert(app.undoBtn.disabled === true, '초기 undo는 비활성화된다');
      assert(app.redoBtn.disabled === true, '초기 redo는 비활성화된다');
      assert(app.historyInfo.textContent.includes('1 / 1'), '초기 히스토리 정보가 표시된다');
      assert(app.diffLog.textContent.includes('변경'), '초기 diff 로그가 빈 상태를 보여준다');
      assert(app.vdomTree.textContent.trim().length > 0, '초기 VDOM 트리가 렌더링된다');
    });

    await runCase('patch: 유효한 HTML 입력 시 실제 DOM과 히스토리가 갱신된다', async () => {
      const app = await bootApp('patch-valid');
      app.testArea.value = `
        <div id="app">
          <h1>Updated List</h1>
          <ul>
            <li class="done" data-key="item-1">Milk</li>
            <li data-key="item-2">Eggs</li>
            <li data-key="item-3">Bread</li>
          </ul>
          <p class="count">3 items</p>
        </div>
      `.trim();

      click(app.patchBtn);

      assert(app.realArea.querySelector('h1')?.textContent === 'Updated List', 'real DOM 텍스트가 변경된다');
      assert(app.undoBtn.disabled === false, 'patch 후 undo가 가능해진다');
      assert(app.redoBtn.disabled === true, 'patch 직후 redo는 비활성화다');
      assert(app.historyInfo.textContent.includes('2 / 2'), '히스토리가 2개 상태를 가리킨다');
      assert(app.diffLog.textContent.trim().length > 0, 'diff 로그가 갱신된다');
    });

    await runCase('patch: 빈 입력은 무시된다', async () => {
      const app = await bootApp('patch-empty');
      const before = normalize(app.realArea.innerHTML);

      app.testArea.value = '   ';
      click(app.patchBtn);

      assert(normalize(app.realArea.innerHTML) === before, 'real DOM이 유지된다');
      assert(app.historyInfo.textContent.includes('1 / 1'), '히스토리가 증가하지 않는다');
      assert(app.undoBtn.disabled === true, 'undo 상태가 그대로다');
    });

    await runCase('patch: 파싱 가능한 루트 엘리먼트가 없으면 인라인 에러를 표시하고 중단한다', async () => {
      const app = await bootApp('patch-invalid');
      const before = normalize(app.realArea.innerHTML);
      app.testArea.value = 'plain text only';
      click(app.patchBtn);

      assert(app.appAlert.hidden === false, '인라인 에러가 표시된다');
      assert(app.appAlert.textContent.includes('유효한 HTML을 입력해주세요.'), '에러 문구가 표시된다');
      assert(normalize(app.realArea.innerHTML) === before, 'real DOM이 유지된다');
      assert(app.historyInfo.textContent.includes('1 / 1'), '히스토리가 증가하지 않는다');
    });

    await runCase('undo / redo: patch 이후 이전 상태와 다음 상태로 이동한다', async () => {
      const app = await bootApp('undo-redo');
      app.testArea.value = `
        <div id="app">
          <h1>Shopping List</h1>
          <ul>
            <li class="done" data-key="item-1">Milk</li>
            <li data-key="item-2">Yogurt</li>
            <li data-key="item-3">Bread</li>
          </ul>
          <p class="count">3 items</p>
        </div>
      `.trim();

      click(app.patchBtn);
      assert(app.realArea.textContent.includes('Yogurt'), 'patch 결과가 반영된다');

      click(app.undoBtn);
      assert(app.realArea.textContent.includes('Eggs'), 'undo 후 이전 상태로 복원된다');
      assert(app.testArea.value.includes('Eggs'), 'textarea도 이전 상태로 복원된다');
      assert(app.redoBtn.disabled === false, 'undo 후 redo가 가능해진다');

      click(app.redoBtn);
      assert(app.realArea.textContent.includes('Yogurt'), 'redo 후 다음 상태로 복원된다');
      assert(app.testArea.value.includes('Yogurt'), 'textarea도 다음 상태로 복원된다');
    });

    await runCase('redo stack: undo 후 새 patch를 하면 redo 이력이 사라진다', async () => {
      const app = await bootApp('redo-cleared');

      app.testArea.value = `
        <div id="app">
          <h1>First Patch</h1>
          <ul>
            <li class="done" data-key="item-1">Milk</li>
            <li data-key="item-2">Eggs</li>
            <li data-key="item-3">Bread</li>
          </ul>
          <p class="count">3 items</p>
        </div>
      `.trim();
      click(app.patchBtn);

      click(app.undoBtn);

      app.testArea.value = `
        <div id="app">
          <h1>Second Patch</h1>
          <ul>
            <li class="done" data-key="item-1">Milk</li>
            <li data-key="item-2">Eggs</li>
            <li data-key="item-3">Bread</li>
          </ul>
          <p class="count">3 items</p>
        </div>
      `.trim();
      click(app.patchBtn);

      assert(app.realArea.querySelector('h1')?.textContent === 'Second Patch', '새 patch가 반영된다');
      assert(app.redoBtn.disabled === true, 'redo 이력이 제거된다');
      assert(app.historyInfo.textContent.includes('2 / 2'), '히스토리가 새 분기로 갱신된다');
    });

    renderResults();
    if (currentTestEl) currentTestEl.textContent = '✅ 완료';
  </script>
</body>
</html>
