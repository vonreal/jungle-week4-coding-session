<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diff Algorithm Tests</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
      --border: #2e3352; --accent: #6c63ff; --accent2: #00d4aa;
      --danger: #ff5c5c; --text: #e0e4f5; --text-muted: #7b82a8;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Pretendard', system-ui, sans-serif; padding: 24px; }
    h1 { font-size: 22px; font-weight: 700; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
    .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 28px; }
    .summary { padding: 16px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; }
    .all-pass { background: rgba(0,212,170,0.12); border: 1px solid rgba(0,212,170,0.3); color: var(--accent2); }
    .has-fail { background: rgba(255,92,92,0.12); border: 1px solid rgba(255,92,92,0.3); color: var(--danger); }
    .fail-count { font-size: 13px; font-weight: 400; color: var(--danger); }
    .result-list { display: flex; flex-direction: column; gap: 6px; }
    .result-item { display: flex; align-items: baseline; gap: 10px; padding: 9px 14px; border-radius: 7px; font-size: 13px; font-family: var(--font-mono); }
    .result-item.pass { background: var(--surface); border-left: 3px solid var(--accent2); }
    .result-item.fail { background: rgba(255,92,92,0.08); border-left: 3px solid var(--danger); }
    .result-icon { font-size: 14px; }
    .result-msg { flex: 1; }
    .result-error { color: var(--danger); font-size: 11px; }
    a.back { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; font-size: 13px; margin-bottom: 20px; }
    a.back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← 메인으로 돌아가기</a>
  <h1>Diff Algorithm — 테스트</h1>
  <p class="subtitle">5가지 핵심 케이스 + Key 기반 매칭 + 엣지 케이스를 검증합니다.</p>
  <div id="test-results">테스트 실행 중...</div>

<script type="module">
import { diff } from '../src/diff.js';
import { describe, it, assert, assertEqual, renderResults } from './test-runner.js';

// 헬퍼: element vnode 생성
function el(tag, props = {}, children = [], key = null) {
  return { type: 'element', tag, props, key: key ?? props['data-key'] ?? null, children };
}
function txt(value) { return { type: 'text', value }; }
function byType(patches, type) {
  return patches.filter((patch) => patch.type === type);
}
function assertSinglePatch(patches, type, message) {
  const matches = byType(patches, type);
  assert(matches.length === 1, `${message}: ${type} 패치 1개`);
  return matches[0];
}
function assertPatchPath(patch, expectedPath, message) {
  assertEqual(patch?.path, expectedPath, `${message}: path ${JSON.stringify(expectedPath)}`);
}

// ──────────────────────────────────────────────
// 1. 텍스트 변경
// ──────────────────────────────────────────────
describe('텍스트 변경 (UPDATE_TEXT)', () => {
  it('텍스트 값이 달라지면 UPDATE_TEXT 패치 생성', () => {
    const oldV = el('p', {}, [txt('Hello')]);
    const newV = el('p', {}, [txt('World')]);
    const patches = diff(oldV, newV);
    const patch = assertSinglePatch(patches, 'UPDATE_TEXT', '텍스트 변경');
    assert(patches.length === 1, '패치 1개');
    assertPatchPath(patch, [0], '텍스트 변경');
    assert(patch.value === 'World', '새 값 World');
    assert(patch.oldValue === 'Hello', '이전 값 Hello');
  });

  it('텍스트가 동일하면 패치 없음', () => {
    const oldV = el('p', {}, [txt('Same')]);
    const newV = el('p', {}, [txt('Same')]);
    assert(diff(oldV, newV).length === 0, '패치 없음');
  });
});

// ──────────────────────────────────────────────
// 2. Props 변경
// ──────────────────────────────────────────────
describe('Props 변경 (UPDATE_PROP / REMOVE_PROP)', () => {
  it('prop 추가 시 UPDATE_PROP', () => {
    const patches = diff(el('div', {}), el('div', { class: 'new' }));
    const patch = assertSinglePatch(patches, 'UPDATE_PROP', 'prop 추가');
    assertPatchPath(patch, [], 'prop 추가');
    assert(patch.key === 'class', 'class 추가');
    assert(patch.value === 'new', '새 class 값');
    assert(patch.oldValue === undefined, '이전 class 값 없음');
  });

  it('prop 값 변경 시 UPDATE_PROP', () => {
    const patches = diff(el('div', { class: 'old' }), el('div', { class: 'new' }));
    const patch = assertSinglePatch(patches, 'UPDATE_PROP', 'prop 변경');
    assertPatchPath(patch, [], 'prop 변경');
    assert(patch.key === 'class', 'class 변경 key');
    assert(patch.value === 'new', '새 class 값');
    assert(patch.oldValue === 'old', '이전 class 값');
  });

  it('prop 제거 시 REMOVE_PROP', () => {
    const patches = diff(el('div', { class: 'x' }), el('div', {}));
    const patch = assertSinglePatch(patches, 'REMOVE_PROP', 'prop 제거');
    assertPatchPath(patch, [], 'prop 제거');
    assert(patch.key === 'class', 'class 제거');
    assert(patch.oldValue === 'x', '제거된 값 유지');
  });

  it('props 동일하면 패치 없음', () => {
    const patches = diff(el('div', { id: 'a', class: 'b' }), el('div', { id: 'a', class: 'b' }));
    assert(patches.length === 0, '패치 없음');
  });
});

// ──────────────────────────────────────────────
// 3. 노드 추가
// ──────────────────────────────────────────────
describe('노드 추가 (ADD)', () => {
  it('자식 추가 시 ADD 패치', () => {
    const oldV = el('ul', {}, [el('li', {}, [txt('A')])]);
    const newV = el('ul', {}, [el('li', {}, [txt('A')]), el('li', {}, [txt('B')])]);
    const patches = diff(oldV, newV);
    const patch = assertSinglePatch(patches, 'ADD', '자식 추가');
    assertPatchPath(patch, [1], '자식 추가');
    assertEqual(patch.newNode, el('li', {}, [txt('B')]), '추가된 노드 정보');
  });
});

// ──────────────────────────────────────────────
// 4. 노드 제거
// ──────────────────────────────────────────────
describe('노드 제거 (REMOVE)', () => {
  it('자식 제거 시 REMOVE 패치', () => {
    const oldV = el('ul', {}, [el('li', {}, [txt('A')]), el('li', {}, [txt('B')])]);
    const newV = el('ul', {}, [el('li', {}, [txt('A')])]);
    const patches = diff(oldV, newV);
    const patch = assertSinglePatch(patches, 'REMOVE', '자식 제거');
    assertPatchPath(patch, [1], '자식 제거');
  });
});

// ──────────────────────────────────────────────
// 5. 노드 교체 (태그 변경)
// ──────────────────────────────────────────────
describe('노드 교체 (REPLACE)', () => {
  it('태그가 다르면 REPLACE', () => {
    const patches = diff(el('p', {}, [txt('Hi')]), el('span', {}, [txt('Hi')]));
    const patch = assertSinglePatch(patches, 'REPLACE', '태그 변경');
    assertPatchPath(patch, [], '태그 변경');
    assert(patch.oldNode.tag === 'p', '이전 태그 p');
    assert(patch.newNode.tag === 'span', '새 태그 span');
  });

  it('타입 다름 (text → element) → REPLACE', () => {
    const patches = diff(txt('hi'), el('span', {}, [txt('hi')]));
    const patch = assertSinglePatch(patches, 'REPLACE', 'text→element 변경');
    assertPatchPath(patch, [], 'text→element 변경');
    assert(patch.oldNode.type === 'text', '이전 타입 text');
    assert(patch.newNode.type === 'element', '새 타입 element');
  });
});

// ──────────────────────────────────────────────
// 6. Key 기반 매칭
// ──────────────────────────────────────────────
describe('Key 기반 매칭', () => {
  it('키 있는 리스트 순서 변경 — 텍스트 diff 발생', () => {
    const oldV = el('ul', {}, [
      el('li', { 'data-key': 'a' }, [txt('A')]),
      el('li', { 'data-key': 'b' }, [txt('B')]),
    ]);
    const newV = el('ul', {}, [
      el('li', { 'data-key': 'b' }, [txt('B')]),
      el('li', { 'data-key': 'a' }, [txt('A')]),
    ]);
    const patches = diff(oldV, newV);
    assert(Array.isArray(patches), '패치 배열 반환');
    assert(patches.length === 0, '동일 key/내용 순서 변경만으로는 패치 없음');
  });

  it('중복 key가 있더라도 첫 번째 중복 노드 제거를 놓치지 않아야 한다', () => {
    const oldV = el('ul', {}, [
      el('li', { 'data-key': 'dup' }, [txt('First')]),
      el('li', { 'data-key': 'dup' }, [txt('Second')]),
    ]);
    const newV = el('ul', {}, [
      el('li', { 'data-key': 'dup' }, [txt('Second')]),
    ]);
    const patches = diff(oldV, newV);

    assert(
      patches.some(p => p.type === 'REMOVE' && p.path.join(',') === '0'),
      '첫 번째 중복 key 노드 제거도 감지되어야 한다'
    );
  });

  it('키 있는 리스트 중간 삽입', () => {
    const oldV = el('ul', {}, [
      el('li', { 'data-key': 'a' }, [txt('A')]),
      el('li', { 'data-key': 'c' }, [txt('C')]),
    ]);
    const newV = el('ul', {}, [
      el('li', { 'data-key': 'a' }, [txt('A')]),
      el('li', { 'data-key': 'b' }, [txt('B')]),
      el('li', { 'data-key': 'c' }, [txt('C')]),
    ]);
    const patches = diff(oldV, newV);
    const patch = assertSinglePatch(patches, 'ADD', 'key 중간 삽입');
    assertPatchPath(patch, [1], 'key 중간 삽입');
    assert(patch.newNode.key === 'b', '추가된 key b');
  });

  it('키 있는 리스트 항목 제거', () => {
    const oldV = el('ul', {}, [
      el('li', { 'data-key': 'a' }, [txt('A')]),
      el('li', { 'data-key': 'b' }, [txt('B')]),
      el('li', { 'data-key': 'c' }, [txt('C')]),
    ]);
    const newV = el('ul', {}, [
      el('li', { 'data-key': 'a' }, [txt('A')]),
      el('li', { 'data-key': 'c' }, [txt('C')]),
    ]);
    const patches = diff(oldV, newV);
    const patch = assertSinglePatch(patches, 'REMOVE', 'key 항목 제거');
    assertPatchPath(patch, [1], 'key 항목 제거');
  });

  it('같은 key 노드 내부 텍스트 변경만 추적', () => {
    const oldV = el('ul', {}, [
      el('li', { 'data-key': 'a' }, [txt('A')]),
      el('li', { 'data-key': 'b' }, [txt('B')]),
    ]);
    const newV = el('ul', {}, [
      el('li', { 'data-key': 'b' }, [txt('B updated')]),
      el('li', { 'data-key': 'a' }, [txt('A')]),
    ]);
    const patches = diff(oldV, newV);
    const patch = assertSinglePatch(patches, 'UPDATE_TEXT', 'key 재정렬 + 텍스트 변경');
    assertPatchPath(patch, [0, 0], 'key 재정렬 + 텍스트 변경');
    assert(patch.oldValue === 'B', '이전 텍스트 B');
    assert(patch.value === 'B updated', '새 텍스트 B updated');
  });

  it('key 없는 노드는 순서대로 fallback 비교', () => {
    const oldV = el('section', {}, [
      el('p', {}, [txt('alpha')]),
      el('div', { 'data-key': 'fixed' }, [txt('keep')]),
    ]);
    const newV = el('section', {}, [
      el('p', {}, [txt('beta')]),
      el('div', { 'data-key': 'fixed' }, [txt('keep')]),
      el('p', {}, [txt('gamma')]),
    ]);
    const patches = diff(oldV, newV);
    const textPatch = assertSinglePatch(patches, 'UPDATE_TEXT', 'unkeyed fallback 텍스트 변경');
    const addPatch = assertSinglePatch(patches, 'ADD', 'unkeyed fallback 노드 추가');
    assertPatchPath(textPatch, [0, 0], 'unkeyed fallback 텍스트 변경');
    assertPatchPath(addPatch, [2], 'unkeyed fallback 노드 추가');
    assertEqual(addPatch.newNode, el('p', {}, [txt('gamma')]), '추가된 unkeyed 노드');
  });
});

// ──────────────────────────────────────────────
// 7. 엣지 케이스
// ──────────────────────────────────────────────
describe('엣지 케이스', () => {
  it('null → node: ADD', () => {
    const patches = diff(null, el('div'));
    const patch = assertSinglePatch(patches, 'ADD', 'null→node');
    assertPatchPath(patch, [], 'null→node');
  });

  it('node → null: REMOVE', () => {
    const patches = diff(el('div'), null);
    const patch = assertSinglePatch(patches, 'REMOVE', 'node→null');
    assertPatchPath(patch, [], 'node→null');
  });

  it('동일 트리 — 패치 없음', () => {
    const v = el('div', { id: 'x' }, [el('span', {}, [txt('hello')])]);
    const patches = diff(v, JSON.parse(JSON.stringify(v)));
    assert(patches.length === 0, '동일 트리 패치 없음');
  });

  it('style 객체 내용이 같으면 참조가 달라도 패치가 없어야 한다', () => {
    const patches = diff(
      el('div', { style: { color: 'red', backgroundColor: 'blue' } }),
      el('div', { style: { color: 'red', backgroundColor: 'blue' } })
    );
    assert(patches.length === 0, '동일한 style 객체 내용이면 패치 없음');
  });

  it('깊게 중첩된 변경 감지', () => {
    const oldV = el('div', {}, [el('div', {}, [el('div', {}, [txt('deep')])])]);
    const newV = el('div', {}, [el('div', {}, [el('div', {}, [txt('changed')])])]);
    const patches = diff(oldV, newV);
    const patch = assertSinglePatch(patches, 'UPDATE_TEXT', '깊은 텍스트 변경');
    assertPatchPath(patch, [0, 0, 0], '깊은 텍스트 변경');
    assert(patch.oldValue === 'deep', '이전 deep');
    assert(patch.value === 'changed', '새 changed');
  });

  it('같은 태그, props만 다름', () => {
    const patches = diff(
      el('div', { class: 'a', id: 'x' }),
      el('div', { class: 'b', id: 'x' })
    );
    assert(patches.every(p => p.type === 'UPDATE_PROP' || p.type === 'REMOVE_PROP'), 'props 패치만');
    assert(patches.some(p => p.type === 'UPDATE_PROP' && p.key === 'class'), 'class 변경 감지');
  });

  it('동시에 여러 변경 — 모두 감지', () => {
    const oldV = el('div', { id: 'a' }, [txt('old text'), el('span', { class: 'x' })]);
    const newV = el('div', { id: 'b' }, [txt('new text'), el('span', { class: 'y' })]);
    const patches = diff(oldV, newV);
    assert(patches.length === 3, '정확히 3개 패치');
    assert(byType(patches, 'UPDATE_PROP').length === 2, 'prop 변경 2개');
    assert(byType(patches, 'UPDATE_TEXT').length === 1, 'text 변경 1개');
  });

  it('빈 트리 vs 자식 있는 트리', () => {
    const patches = diff(el('ul', {}, []), el('ul', {}, [el('li', {}, [txt('item')])]));
    const patch = assertSinglePatch(patches, 'ADD', '빈 트리 → 자식 있음');
    assertPatchPath(patch, [0], '빈 트리 → 자식 있음');
  });

  it('자식 있는 트리 vs 빈 트리', () => {
    const patches = diff(el('ul', {}, [el('li', {}, [txt('item')])]), el('ul', {}, []));
    const patch = assertSinglePatch(patches, 'REMOVE', '자식 있음 → 빈 트리');
    assertPatchPath(patch, [0], '자식 있음 → 빈 트리');
  });

  it('자식 중간 element → text 교체', () => {
    const oldV = el('div', {}, [el('strong', {}, [txt('bold')])]);
    const newV = el('div', {}, [txt('plain')]);
    const patches = diff(oldV, newV);
    const patch = assertSinglePatch(patches, 'REPLACE', '중간 element → text 교체');
    assertPatchPath(patch, [0], '중간 element → text 교체');
    assert(patch.oldNode.type === 'element', '이전 노드 element');
    assert(patch.newNode.type === 'text', '새 노드 text');
  });

  it('중첩 요소의 prop 제거 path 추적', () => {
    const oldV = el('section', {}, [el('button', { disabled: '' }, [txt('save')])]);
    const newV = el('section', {}, [el('button', {}, [txt('save')])]);
    const patches = diff(oldV, newV);
    const patch = assertSinglePatch(patches, 'REMOVE_PROP', '중첩 prop 제거');
    assertPatchPath(patch, [0], '중첩 prop 제거');
    assert(patch.key === 'disabled', 'disabled 제거');
  });
});

// 결과 렌더링
renderResults();
</script>
</body>
</html>
